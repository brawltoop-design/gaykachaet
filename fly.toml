# Fly.io — деплой: flyctl launch --copy-config --now  (или flyctl deploy)
app = "gaykachaet"
primary_region = "fra"   # Франкфурт; можно "waw" (Варшава) — ближе к RU

[build]

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"   # склейка идёт без перекодирования, памяти хватает; для 4K можно 1024mb
