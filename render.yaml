# Render Blueprint — деплой в один клик.
# Render Dashboard → New → Blueprint → выбрать этот репозиторий.
services:
  - type: web
    name: gaykachaet
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
